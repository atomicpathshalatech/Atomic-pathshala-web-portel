# Reverse proxy in front of MediaMTX. Two jobs:
#  1. Terminate TLS (WHIP from a browser requires https in production —
#     getUserMedia/RTCPeerConnection are only available in secure contexts).
#  2. Gate the MediaMTX control API behind a shared-secret bearer token so
#     only this app's backend (never a browser) can add/remove paths.
#
# The WHIP publish/play endpoints are intentionally left open (no bearer
# check) since the browser calls them directly with only the per-session
# relayPath as its "credential" (an unguessable id, same trust model as a
# YouTube unlisted video's id) — matching how the plan's relayPath/relayWhipUrl
# fields are used.

server {
    listen 443 ssl;
    server_name relay.example.com; # set to your actual relay hostname

    ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;

    # Control API — bearer-gated, backend-only.
    location /v3/ {
        if ($http_authorization != "Bearer CHANGE_ME_MEDIA_RELAY_API_TOKEN") {
            return 401;
        }
        proxy_pass http://127.0.0.1:9997;
    }

    # WHIP publish/play — open, path id is the credential.
    location / {
        proxy_pass http://127.0.0.1:8889;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
