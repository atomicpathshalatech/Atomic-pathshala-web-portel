# Builds the Atomic Pathshala Android app (.apk) and, when storage secrets are
# set, publishes it so "Download App" in the portal serves it at once.
#
# Run it: GitHub → Actions → "Android APK" → Run workflow → enter the version.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   Signing — needed for an APK that people install and later update:
#     ANDROID_KEYSTORE_BASE64   the release key (.jks) as base64
#     ANDROID_KEYSTORE_PASSWORD
#     ANDROID_KEY_ALIAS
#     ANDROID_KEY_PASSWORD
#   Publishing (optional — otherwise upload the APK on Team → App Releases):
#     CLOUDFLARE_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET_NAME
#
# Without the signing secrets it still builds a debug APK (for testing only:
# each debug build has a different key, so phones can't update one with the next).
name: Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"
      notes:
        description: "What's new (optional)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        # Only the Capacitor CLI and plugins are needed here; skip install scripts.
        run: npm ci --ignore-scripts

      - name: Sync the web app into the Android project
        run: npx cap sync android

      - name: Set up the signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/atomic-release-key.jks
            {
              echo "storeFile=../atomic-release-key.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets — building a debug APK for testing only."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the APK
        working-directory: android
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          TASK=assembleDebug
          [ "${{ steps.signing.outputs.signed }}" = "true" ] && TASK=assembleRelease
          ./gradlew "$TASK" -PversionName="$VERSION" --no-daemon
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          mkdir -p ../dist-apk
          cp "$APK" "../dist-apk/Atomic-Pathshala-$VERSION.apk"
          ls -l ../dist-apk

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f android/atomic-release-key.jks android/keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: Atomic-Pathshala-${{ inputs.version }}-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish to Download App
        if: steps.signing.outputs.signed == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_BUCKET_NAME" ]; then
            echo "::notice::Storage secrets not set — download the APK from this run's Artifacts and upload it on Team → App Releases."
            exit 0
          fi
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          FILE="Atomic-Pathshala-$VERSION.apk"
          KEY="apps/android/$FILE"
          # The installer first, the manifest last: the portal must never point at a missing file.
          aws s3 cp "dist-apk/$FILE" "s3://$R2_BUCKET_NAME/$KEY" --endpoint-url "$ENDPOINT" \
            --content-type application/vnd.android.package-archive
          SIZE=$(stat -c %s "dist-apk/$FILE")
          jq -n --arg v "$VERSION" --arg k "$KEY" --arg f "$FILE" --argjson s "$SIZE" \
                --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg n "$NOTES" \
            '{platform:"android",version:$v,key:$k,fileName:$f,sizeBytes:$s,publishedAt:$t,notes:(if $n=="" then null else $n end)}' > latest.json
          aws s3 cp latest.json "s3://$R2_BUCKET_NAME/apps/android/latest.json" --endpoint-url "$ENDPOINT" \
            --content-type application/json --cache-control no-cache
          echo "Published $FILE — Download App now serves v$VERSION."
